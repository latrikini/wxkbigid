name: deploy-pwa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Write site
        run: |
          mkdir -p site
          cat > site/manifest.webmanifest <<'EOF'
          {
            "name": "LatrikPlayer",
            "short_name": "Latrik",
            "start_url": "./",
            "display": "fullscreen",
            "orientation": "landscape",
            "background_color": "#000000",
            "theme_color": "#000000"
          }
          EOF
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
          <link rel="manifest" href="manifest.webmanifest">
          <title>LatrikPlayer</title>
          <style>
          html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;font-family:ui-monospace,Menlo,monospace}
          .screen{position:fixed;inset:0;display:none;background:#000}
          .screen.on{display:flex}
          #loading{flex-direction:column;align-items:center;justify-content:center;gap:22px}
          #step{font-size:18px}
          #bar{width:360px;max-width:70vw;height:4px;background:#333}
          #fill{height:100%;width:0;background:#fff}
          #pct{font-size:14px;opacity:.7}
          #brand{align-items:center;justify-content:center;flex-direction:column;gap:18px;cursor:pointer;font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:30px}
          #brand small{font-size:14px;opacity:.6;font-family:ui-monospace,Menlo,monospace}
          #player{position:absolute;inset:0;width:100%;height:100%;border:0}
          #pad{position:absolute;inset:0;pointer-events:none}
          #joy{position:absolute;left:40px;bottom:40px;width:140px;height:140px}
          #btns{position:absolute;right:40px;bottom:40px;width:150px;height:150px;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr}
          #btns svg{width:42px;height:42px;margin:auto}
          #rotate{display:none;position:fixed;inset:0;background:#000;align-items:center;justify-content:center;font-size:16px;z-index:9}
          @media (orientation:portrait){#rotate{display:flex}}
          </style>
          </head>
          <body>
          <div id="loading" class="screen on">
            <div id="step">Loading Assets</div>
            <div id="bar"><div id="fill"></div></div>
            <div id="pct">0%</div>
          </div>
          <div id="brand" class="screen"><div>by latrik</div><small>tap to launch</small></div>
          <div id="video" class="screen">
            <div id="player"></div>
            <div id="pad">
              <svg id="joy" viewBox="0 0 140 140">
                <circle cx="70" cy="70" r="66" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3"/>
                <circle cx="70" cy="70" r="30" fill="rgba(255,255,255,.15)"/>
              </svg>
              <div id="btns">
                <div></div>
                <svg viewBox="0 0 42 42"><path d="M21 6 L36 36 L6 36 Z" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="3" stroke-linejoin="round"/></svg>
                <div></div>
                <svg viewBox="0 0 42 42"><rect x="6" y="6" width="30" height="30" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="3"/></svg>
                <div></div>
                <svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="15" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="3"/></svg>
                <div></div>
                <svg viewBox="0 0 42 42"><path d="M8 8 L34 34 M34 8 L8 34" stroke="rgba(255,255,255,.6)" stroke-width="3" stroke-linecap="round"/></svg>
                <div></div>
              </div>
            </div>
          </div>
          <div id="rotate">rotate your device</div>
          <script>
          const VID = 'Xn-l5FFSLqM', START = 2401, DURATION = 30000;
          const $ = id => document.getElementById(id);
          const show = id => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
            $(id).classList.add('on');
          };

          (function loading() {
            const t0 = Date.now();
            const tick = () => {
              const p = Math.min((Date.now() - t0) / DURATION, 1);
              $('fill').style.width = (p * 100) + '%';
              $('pct').textContent = Math.floor(p * 100) + '%';
              $('step').textContent =
                p < .25 ? 'Loading Assets' :
                p < .50 ? 'Compiling' :
                p < .80 ? 'Launcher Emulating' : 'Launching...';
              if (p < 1) requestAnimationFrame(tick);
              else show('brand');
            };
            tick();
          })();

          $('brand').addEventListener('click', () => {
            show('video');
            const s = document.createElement('script');
            s.src = 'https://www.youtube.com/iframe_api';
            document.body.appendChild(s);
          });

          let player, fallbackTimer;
          window.onYouTubeIframeAPIReady = function () {
            player = new YT.Player('player', {
              videoId: VID,
              playerVars: {
                start: START, autoplay: 1, controls: 0, disablekb: 1, fs: 0,
                rel: 0, modestbranding: 1, iv_load_policy: 3, playsinline: 1
              },
              events: {
                onReady: e => {
                  e.target.setPlaybackQuality('hd1080');
                  e.target.playVideo();
                  fallbackTimer = setTimeout(() => {
                    if (player.getPlayerState() !== YT.PlayerState.PLAYING) {
                      player.setPlaybackQuality('hd720');
                    }
                  }, 15000);
                },
                onError: () => {
                  player.loadVideoById({ videoId: VID, startSeconds: START, suggestedQuality: 'hd720' });
                }
              }
            });
          };
          </script>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
